<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informe CTCAE de analítica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: dos paneles (entrada / informe) sobre una tabla de parámetros a todo el ancho. */
:root{
  --bg:#f4f6f7; --panel:#ffffff; --ink:#16232b; --muted:#5b6b75; --line:#d9e0e4;
  --accent:#0f5e7a; --accent-ink:#ffffff; --field:#fbfcfc;
  --g0-bg:#e9eef0; --g0-fg:#44545d;
  --g1-bg:#fbf0c2; --g1-fg:#6b5300;
  --g2-bg:#fde0b0; --g2-fg:#7a4300;
  --g3-bg:#f9c3b4; --g3-fg:#8a2108;
  --g4-bg:#b3261e; --g4-fg:#ffffff;
  --gn-bg:#dde3ff; --gn-fg:#2c3a8c;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10181d; --panel:#172229; --ink:#e4ecf0; --muted:#97a8b2; --line:#2a3a43;
    --accent:#4cb4d6; --accent-ink:#071a22; --field:#122027;
    --g0-bg:#26343c; --g0-fg:#b7c6ce;
    --g1-bg:#4a3f10; --g1-fg:#f6dd7a;
    --g2-bg:#58370f; --g2-fg:#fbc983;
    --g3-bg:#68261a; --g3-fg:#ffb9a6;
    --g4-bg:#d9453b; --g4-fg:#ffffff;
    --gn-bg:#28316b; --gn-fg:#c9d1ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10181d; --panel:#172229; --ink:#e4ecf0; --muted:#97a8b2; --line:#2a3a43;
  --accent:#4cb4d6; --accent-ink:#071a22; --field:#122027;
  --g0-bg:#26343c; --g0-fg:#b7c6ce;
  --g1-bg:#4a3f10; --g1-fg:#f6dd7a;
  --g2-bg:#58370f; --g2-fg:#fbc983;
  --g3-bg:#68261a; --g3-fg:#ffb9a6;
  --g4-bg:#d9453b; --g4-fg:#ffffff;
  --gn-bg:#28316b; --gn-fg:#c9d1ff;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);padding:20px 16px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:4px;padding:4px 2px}
h1{font-size:22px;line-height:1.2;margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:14px;max-width:72ch}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h2{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
textarea{width:100%;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;padding:10px 12px;resize:vertical;font:13px/1.5 var(--font-mono)}
#input{min-height:330px;white-space:pre;overflow:auto}
#report{min-height:330px;font-family:var(--font-body);font-size:14.5px}
textarea:focus,input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;padding:8px 16px}
.row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.row label{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
select,input[type=date],input.num{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:6px;padding:4px 8px}
.actions{display:flex;align-items:center;gap:12px}
#copied{font-size:13px;color:var(--accent);min-height:1em}
.warn{font-size:13px;color:var(--muted);border-left:3px solid var(--g2-bg);padding:2px 0 2px 10px;margin:0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
input.num{width:84px;text-align:right;font-family:var(--font-mono);font-size:13px}
input.num.edited{border-color:var(--accent)}
.dash{color:var(--muted)}
.chip{display:inline-block;min-width:34px;text-align:center;padding:1px 9px;border-radius:99px;font-weight:600;font-size:12.5px}
.c0{background:var(--g0-bg);color:var(--g0-fg)}
.c1{background:var(--g1-bg);color:var(--g1-fg)}
.c2{background:var(--g2-bg);color:var(--g2-fg)}
.c3{background:var(--g3-bg);color:var(--g3-fg)}
.c4{background:var(--g4-bg);color:var(--g4-fg)}
.cn{background:var(--gn-bg);color:var(--gn-fg)}
.small{font-size:12.5px;color:var(--muted)}
details{font-size:13px;color:var(--muted)}
summary{cursor:pointer}
details pre{margin:6px 0 0;font:12px/1.5 var(--font-mono);white-space:pre-wrap;color:var(--ink)}
footer{font-size:12.5px;color:var(--muted);max-width:90ch;display:flex;flex-direction:column;gap:6px}
footer p{margin:0}
.sum{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:no-preference){button{transition:border-color .12s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="phead">
      <h1 data-i18n="title"></h1>
      <label for="lang" class="row"><span data-i18n="lang"></span>
        <select id="lang"><option value="es">Español</option><option value="en">English</option></select>
      </label>
    </div>
    <p data-i18n="sub"></p>
  </header>

  <main class="grid">
    <section class="panel" aria-labelledby="h-in">
      <div class="phead">
        <h2 id="h-in" data-i18n="hIn"></h2>
        <div class="row">
          <button type="button" id="btnSample" data-i18n="sample"></button>
          <button type="button" id="btnClear" data-i18n="clear"></button>
        </div>
      </div>
      <textarea id="input" spellcheck="false" aria-label="Lab text" data-i18n-ph="inPh"></textarea>
      <div class="row">
        <label for="sex"><span data-i18n="sex"></span>
          <select id="sex"><option value="M" data-i18n="male"></option><option value="F" data-i18n="female"></option></select>
        </label>
        <label for="date"><span data-i18n="date"></span>
          <input type="date" id="date">
        </label>
      </div>
      <p class="warn" data-i18n="warn"></p>
    </section>

    <section class="panel" aria-labelledby="h-out">
      <div class="phead">
        <h2 id="h-out" data-i18n="hOut"></h2>
        <div class="actions"><span id="copied" role="status" aria-live="polite"></span><button type="button" id="btnCopy" class="primary" data-i18n="copy"></button></div>
      </div>
      <textarea id="report" aria-label="Report"></textarea>
      <div class="row">
        <label for="fmt"><span data-i18n="fmt"></span>
          <select id="fmt"><option value="list" data-i18n="list"></option><option value="para" data-i18n="para"></option></select>
        </label>
        <label for="gs"><span data-i18n="gs"></span>
          <select id="gs"><option value="G">G2</option><option value="grado" data-i18n="gOpt2"></option></select>
        </label>
        <label for="units"><span data-i18n="units"></span>
          <select id="units"><option value="ul">/µL</option><option value="e9">×10⁹/L</option></select>
        </label>
      </div>
      <div class="row">
        <label for="oVals"><input type="checkbox" id="oVals" checked> <span data-i18n="oVals"></span></label>
        <label for="oNorm"><input type="checkbox" id="oNorm"> <span data-i18n="oNorm"></span></label>
        <label for="oNotes"><input type="checkbox" id="oNotes" checked> <span data-i18n="oNotes"></span></label>
      </div>
      <p class="small" data-i18n="editable"></p>
    </section>
  </main>

  <section class="panel" aria-labelledby="h-tab">
    <div class="phead">
      <h2 id="h-tab" data-i18n="hTab"></h2>
      <div class="sum" id="summary"></div>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th data-i18n="thParam"></th><th class="r" data-i18n="thVal"></th><th data-i18n="thUnit"></th><th class="r" data-i18n="thLln"></th><th class="r" data-i18n="thUln"></th><th data-i18n="thAlt"></th><th data-i18n="thGrade"></th><th data-i18n="thNote"></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <details id="unrecBox" hidden><summary id="unrecSum"></summary><pre id="unrec"></pre></details>
  </section>

  <footer>
    <p data-i18n="f1"></p>
    <p data-i18n="f2"></p>
    <p data-i18n="f3"></p>
  </footer>
</div>

<script id="core">
/*CORE_START*/
let LANG = 'es';
const S = (es, en) => LANG === 'en' ? en : es;
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const EN2ES = [
  [/glycated|glycosylated/g,'glicosilada'], [/\bhemoglobin\b/g,'hemoglobina'], [/\bplatelets?\b/g,'plaquetas'],
  [/white blood cells?|white cell count|\bwcc\b/g,'leucocitos'], [/neutrophils?/g,'neutrofilos'], [/lymphocytes?/g,'linfocitos'],
  [/\bcreatinine\b/g,'creatinina'], [/alkaline phosphatase/g,'fosfatasa alcalina'], [/\bbilirubin\b/g,'bilirrubina'],
  [/\bdirect\b/g,'directa'], [/\bindirect\b/g,'indirecta'], [/\bconjugated\b/g,'conjugada'],
  [/\bsodium\b/g,'sodio'], [/\bpotassium\b/g,'potasio'], [/\bcorrected\b/g,'corregido'], [/\bcalcium\b/g,'calcio'],
  [/\bionized\b|\bionised\b/g,'ionizado'], [/\balbumin\b/g,'albumina'], [/\bmagnesium\b/g,'magnesio'],
  [/\bphosphorus\b|\bphosphate\b/g,'fosforo'], [/uric acid/g,'acido urico'], [/\bglucose\b/g,'glucosa'],
  [/triglycerides?/g,'trigliceridos'], [/cholesterol/g,'colesterol'], [/\blipase\b/g,'lipasa'], [/\bamylase\b/g,'amilasa'],
  [/creatine kinase|creatine phosphokinase/g,'creatincinasa'], [/\bfibrinogen\b/g,'fibrinogeno'],
  [/partial thromboplastin time/g,'ttpa'], [/d-?dimer/g,'dimero'],
];
const EN_TERM = {'Anemia':'Anemia','Trombopenia':'Platelet count decreased','Leucopenia':'White blood cell decreased','Neutropenia':'Neutrophil count decreased',
  'Linfopenia':'Lymphocyte count decreased','Linfocitosis':'Lymphocyte count increased','Creatinina elevada':'Creatinine increased','AST elevada':'AST increased',
  'ALT elevada':'ALT increased','Fosfatasa alcalina elevada':'Alkaline phosphatase increased','GGT elevada':'GGT increased','Hiperbilirrubinemia':'Blood bilirubin increased',
  'Hiponatremia':'Hyponatremia','Hipernatremia':'Hypernatremia','Hipopotasemia':'Hypokalemia','Hiperpotasemia':'Hyperkalemia','Hipocalcemia':'Hypocalcemia',
  'Hipercalcemia':'Hypercalcemia','Hipoalbuminemia':'Hypoalbuminemia','Hipomagnesemia':'Hypomagnesemia','Hipermagnesemia':'Hypermagnesemia','Hipofosfatemia':'Hypophosphatemia',
  'Hiperuricemia':'Hyperuricemia','Hipoglucemia':'Hypoglycemia','Hiperglucemia':'Hyperglycemia','Hipertrigliceridemia':'Hypertriglyceridemia','Hipercolesterolemia':'Cholesterol high',
  'Lipasa elevada':'Lipase increased','Amilasa elevada':'Serum amylase increased','CPK elevada':'CPK increased','INR elevado':'INR increased',
  'TTPa alargado':'Activated partial thromboplastin time prolonged','Hipofibrinogenemia':'Fibrinogen decreased'};
const EN_SHORT = {'plaquetas':'platelets','leucocitos':'WBC','neutrófilos':'neutrophils','linfocitos':'lymphocytes','creatinina':'creatinine','FA':'ALP',
  'bilirrubina total':'total bilirubin','Ca corregido':'corrected Ca','albúmina':'albumin','ácido úrico':'uric acid','glucosa':'glucose','triglicéridos':'triglycerides',
  'colesterol total':'total cholesterol','lipasa':'lipase','amilasa':'amylase','TTPa':'aPTT','fibrinógeno':'fibrinogen'};
const EN_NAME = {'Hemoglobina':'Hemoglobin','Plaquetas':'Platelets','Leucocitos':'White blood cells','Neutrófilos':'Neutrophils','Linfocitos':'Lymphocytes',
  'Creatinina':'Creatinine','Fosfatasa alcalina':'Alkaline phosphatase','Bilirrubina total':'Total bilirubin','Sodio':'Sodium','Potasio':'Potassium',
  'Calcio corregido':'Corrected calcium','Calcio':'Calcium','Albúmina':'Albumin','Magnesio':'Magnesium','Fósforo':'Phosphorus','Ácido úrico':'Uric acid','Glucosa':'Glucose',
  'Triglicéridos':'Triglycerides','Colesterol total':'Total cholesterol','Lipasa':'Lipase','Amilasa':'Amylase','Fibrinógeno':'Fibrinogen'};
const tTerm = s => LANG === 'en' ? (EN_TERM[s] || s) : s;
const tShort = s => LANG === 'en' ? (EN_SHORT[s] || s) : s;
const tName = s => LANG === 'en' ? (EN_NAME[s] || s) : s;
const SUP = {'³':3,'⁹':9,'⁶':6};
const SCI_RE = /x?\s*10\s*(?:\^|\*\*|\*|e|exp)\s*([-+]?\d+)|x?\s*10\s*([³⁹⁶])/gi;
const NUM_RE = /([<>≤≥]?)\s*(\d+(?:[.,]\d+)*)/;
const RANGE_RE = /(\d+(?:[.,]\d+)*)\s*(?:-|–|—|\ba\b|\bto\b)\s*(\d+(?:[.,]\d+)*)/;
const GLOBAL_SKIP = /urine|orina|24 ?h\b|liquido|\blcr\b|ascitic|pleural|aclaram|filtrad|egfr|cockcroft/;

function parseNum(str, thousands) {
  if (thousands && /^\d{1,3}(\.\d{3})+(,\d+)?$/.test(str)) return parseFloat(str.replace(/\./g, '').replace(',', '.'));
  const hasDot = str.includes('.'), hasCom = str.includes(',');
  if (hasDot && hasCom) {
    const dec = str.lastIndexOf('.') > str.lastIndexOf(',') ? '.' : ',';
    const th = dec === '.' ? ',' : '.';
    return parseFloat(str.split(th).join('').replace(dec, '.'));
  }
  if (hasCom) return parseFloat(str.replace(',', '.'));
  const parts = str.split('.');
  if (parts.length > 2) return parseFloat(parts.join(''));
  return parseFloat(str);
}

/* Helpers de gradación. Los cortes son inclusivos hacia el grado menor, como en CTCAE. */
function gLow(v, lln, cuts, grades) {
  grades = grades || [1, 2, 3, 4];
  if (v >= lln) return 0;
  for (let i = 0; i < cuts.length; i++) if (v >= cuts[i]) return grades[i];
  return grades[cuts.length];
}
function gHigh(v, uln, cuts, grades) {
  grades = grades || [1, 2, 3, 4];
  if (v <= uln) return 0;
  for (let i = 0; i < cuts.length; i++) if (v <= cuts[i]) return grades[i];
  return grades[cuts.length];
}
const fmtNum = (x, dec) => x.toLocaleString(LANG === 'en' ? 'en-US' : 'es-ES', { maximumFractionDigits: dec, minimumFractionDigits: 0, useGrouping: false });
const smartDec = x => Math.abs(x) >= 100 ? 0 : Math.abs(x) >= 10 ? 1 : 2;
const groupDots = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, S('.', ','));
const multTxt = (v, u) => fmtNum(v / u, 1) + S(' × LSN', ' × ULN');
const mulHigh = (v, uln, ms, gr) => gHigh(v, uln, ms.map(m => m * uln), gr);

function countFactor(key, v, sci, ut) {
  if (sci === 3 || sci === 9) return [1000, false];
  if (sci === 6) return [1, false];
  if (/\/\s*(u|µ|μ)\s*l|\/\s*mm|\/\s*mcl/.test(ut)) return [1, false];
  if (/\bk\s*\/|miles/.test(ut)) return [1000, false];
  const lim = key === 'plt' ? 1000 : 100;
  return v < lim ? [1000, true] : [1, true];
}
const hasU = (u, re) => re.test(u);

const SPECS = [
  { key:'hb', name:'Hemoglobina', short:'Hb', unit:'g/dL', use:'lln',
    m:/\b(hemoglobina|hb|hgb)\b/, n:/corpuscular|glicosil|hba1c|media|cmhc|hcm|fetal|\ba2\b|libre|plasma|hemoglobina a$/,
    conv:(v,u)=> hasU(u,/g\s*\/\s*l\b/) ? [0.1,false] : hasU(u,/g\s*\/\s*dl/) ? [1,false] : (v>30?[0.1,true]:[1,false]),
    def:s=>({lln:s==='F'?12:13.5}),
    grade:(v,l)=>{const g=gLow(v,l,[10,8],[1,2,3]);return{g,term:'Anemia',clin:g>=1&&g<=2};} },
  { key:'plt', name:'Plaquetas', short:'plaquetas', unit:'/µL', count:true, use:'lln',
    m:/plaquetas|\bplt\b|trombocitos/, n:/volumen|vpm|mpv|distribucion|pdw|plaquetocrito/,
    def:()=>({lln:150000}),
    grade:(v,l)=>({g:gLow(v,l,[75000,50000,25000]),term:'Trombopenia'}) },
  { key:'wbc', name:'Leucocitos', short:'leucocitos', unit:'/µL', count:true, use:'lln',
    m:/leucocitos|\bwbc\b|globulos blancos|\bleuc\b/, n:/formula|%/,
    def:()=>({lln:4000}),
    grade:(v,l)=>({g:gLow(v,l,[3000,2000,1000]),term:'Leucopenia'}) },
  { key:'neut', name:'Neutrófilos', short:'neutrófilos', unit:'/µL', count:true, pctable:true, use:'lln',
    m:/neutrofilos|\bneut|\bpmn\b|\banc\b|segmentados/, n:/ratio|indice/,
    def:()=>({lln:1800}),
    grade:(v,l)=>({g:gLow(v,l,[1500,1000,500]),term:'Neutropenia'}) },
  { key:'lymph', name:'Linfocitos', short:'linfocitos', unit:'/µL', count:true, pctable:true, use:'lln',
    m:/linfocitos|\blinf\b|\blym/, n:/\bcd\s?\d|subpobl|\bnk\b|atipic|reactiv|ratio|indice/,
    def:()=>({lln:1000}),
    grade:(v,l)=>{const g=gLow(v,l,[800,500,200]);if(g>0)return{g,term:'Linfopenia'};
      const h=gHigh(v,4000,[20000],[2,3]);return h>0?{g:h,term:'Linfocitosis'}:{g:0,term:'Linfopenia'};} },
  { key:'creat', name:'Creatinina', short:'creatinina', unit:'mg/dL', use:'uln',
    m:/creatinina|\bcreat\b|\bcr\b/, n:/ckd|mdrd|cociente|ratio/,
    conv:(v,u)=> hasU(u,/(u|µ|μ)mol/) ? [1/88.4,false] : hasU(u,/mg/) ? [1,false] : (v>20?[1/88.4,true]:[1,false]),
    def:s=>({uln:s==='F'?1.0:1.2}),
    grade:(v,_l,u)=>({g:mulHigh(v,u,[1.5,3,6]),term:'Creatinina elevada',note:multTxt(v,u)}) },
  { key:'ast', name:'AST (GOT)', short:'AST', unit:'U/L', use:'uln',
    m:/\bast\b|\bgot\b|asat|aspartato/, def:()=>({uln:40}),
    grade:(v,_l,u)=>({g:mulHigh(v,u,[3,5,20]),term:'AST elevada',note:multTxt(v,u)}) },
  { key:'alt', name:'ALT (GPT)', short:'ALT', unit:'U/L', use:'uln',
    m:/\balt\b|\bgpt\b|alat|alanina/, def:()=>({uln:41}),
    grade:(v,_l,u)=>({g:mulHigh(v,u,[3,5,20]),term:'ALT elevada',note:multTxt(v,u)}) },
  { key:'alp', name:'Fosfatasa alcalina', short:'FA', unit:'U/L', use:'uln',
    m:/fosfatasa alcalina|\balp\b|\bfa\b|\bfal\b/, def:()=>({uln:130}),
    grade:(v,_l,u)=>({g:mulHigh(v,u,[2.5,5,20]),term:'Fosfatasa alcalina elevada',note:multTxt(v,u)}) },
  { key:'ggt', name:'GGT', short:'GGT', unit:'U/L', use:'uln',
    m:/\bggt\b|gamma ?-?glutamil|gamma ?-?gt|\bgt\b|g-gt/, def:()=>({uln:60}),
    grade:(v,_l,u)=>({g:mulHigh(v,u,[2.5,5,20]),term:'GGT elevada',note:multTxt(v,u)}) },
  { key:'bili', name:'Bilirrubina total', short:'bilirrubina total', unit:'mg/dL', use:'uln',
    m:/bilirrubina|\bbt\b|\bbil\b/, n:/directa|indirecta|conjugada|\bbd\b|\bbi\b|libre/,
    conv:(v,u)=> hasU(u,/(u|µ|μ)mol/) ? [1/17.1,false] : hasU(u,/mg/) ? [1,false] : (v>30?[1/17.1,true]:[1,false]),
    def:()=>({uln:1.2}),
    grade:(v,_l,u)=>({g:mulHigh(v,u,[1.5,3,10]),term:'Hiperbilirrubinemia',note:multTxt(v,u)}) },
  { key:'na', name:'Sodio', short:'Na', unit:'mmol/L', use:'both',
    m:/\bsodio\b|\bna\b|\bna\+/, def:()=>({lln:135,uln:145}),
    grade:(v,l,u)=>{ if(v<l) return{g:gLow(v,l,[130,120],[1,3,4]),term:'Hiponatremia'};
      return{g:gHigh(v,u,[150,155,160]),term:'Hipernatremia'}; } },
  { key:'k', name:'Potasio', short:'K', unit:'mmol/L', use:'both',
    m:/\bpotasio\b|\bk\b|\bk\+/, n:/vitamina/, def:()=>({lln:3.5,uln:5.1}),

function parseText(text) {
  const entries = {}, pcts = {}, unrec = [], dups = [];
  const segs = [];
  text.split(/\r?\n/).forEach(l => l.split(/;|,\s+(?=[a-záéíóúñ])/i).forEach(s => { if (s.trim()) segs.push(s); }));
  for (const raw of segs) {

    let sci = null;
    line = line.replace(SCI_RE, (m, a, b) => { sci = a !== undefined ? parseInt(a, 10) : SUP[b]; return ' '; });
    let n = norm(line);
    for (const [re, to] of EN2ES) n = n.replace(re, to);
    const d = n.match(/\d/);
    if (!d) continue;
    if (GLOBAL_SKIP.test(n)) { unrec.push(raw.trim()); continue; }
    const label = n.slice(0, d.index).replace(/[\s:=\-–]+$/, '').trim();
    const spec = SPECS.find(s => s.m.test(label) && !(s.n && s.n.test(label)));
    if (!spec) { unrec.push(raw.trim()); continue; }
    const rest = n.slice(d.index);
    const vm = rest.match(NUM_RE);
    if (!vm) { unrec.push(raw.trim()); continue; }
    const pn = s => (spec.count && sci === null && /^[1-9]\d{0,2}(,\d{3})+$/.test(s)) ? parseFloat(s.replace(/,/g, '')) : parseNum(s, !!spec.count);
    let v = pn(vm[2]);
    if (!isFinite(v)) { unrec.push(raw.trim()); continue; }
    const after = rest.slice(vm.index + vm[0].length);
    const ut = (after.match(/^[^\d<>≤≥]*/) || [''])[0];
    const isPct = /%/.test(after.slice(0, 14)) || /%/.test(label);
    if (spec.pctable && isPct) { if (!(spec.key in pcts)) pcts[spec.key] = v; continue; }
    let lo = null, hi = null;
    const rm = after.match(RANGE_RE);
    if (rm) { lo = pn(rm[1]); hi = pn(rm[2]); if (!(lo < hi)) { lo = null; hi = null; } }
    else {
      const cm = after.match(/([<>≤≥])\s*(\d+(?:[.,]\d+)*)/);
      if (cm) { const x = pn(cm[2]); if (cm[1] === '<' || cm[1] === '≤') hi = x; else lo = x; }
    }
    let f, assumed;
    if (spec.count) [f, assumed] = countFactor(spec.key, v, sci, ut);
    else if (spec.conv) [f, assumed] = spec.conv(v, ut);
    else { f = 1; assumed = false; }
    v *= f; if (lo !== null) lo *= f; if (hi !== null) hi *= f;
    if (spec.key in entries) { dups.push(spec.name); continue; }

}

function evaluate(parsed, o) {

    }

  if (E.cac) delete E.ca;
  const items = [];
  for (const spec of SPECS) {
    const e = E[spec.key];
    if (!e) continue;
    const def = spec.def(sex), o2 = ov[spec.key] || {};
    const lln = o2.lln !== undefined ? o2.lln : (e.lo !== null && e.lo !== undefined ? e.lo : def.lln);
    const uln = o2.uln !== undefined ? o2.uln : (e.hi !== null && e.hi !== undefined ? e.hi : def.uln);
    const src = k => ov[spec.key] && ov[spec.key][k] !== undefined ? 'editado' : (k === 'lln' ? (e.lo != null) : (e.hi != null)) ? 'línea' : 'defecto';
    let v = e.v, short = spec.short, term = null, noteExtra = '';
    if (spec.key === 'ca' && E.alb) {

      noteExtra = S('Corregido por albúmina (Ca total ', 'Albumin-corrected (total Ca ') + fmtNum(e.v, 1) + ')';
    } else if (spec.key === 'ca') noteExtra = S('Sin corregir por albúmina', 'Not albumin-corrected');
    let r;
    const needL = spec.use === 'lln' || spec.use === 'both', needU = spec.use === 'uln' || spec.use === 'both';
    if ((needL && lln == null) || (needU && uln == null)) r = { g: null, term: spec.name, note: S('Falta rango', 'Missing range') };
    else r = spec.grade(v, lln, uln);
    items.push({
      key: spec.key, name: tName(spec.name), short: tShort(short), unit: spec.unit, count: !!spec.count, use: spec.use,
      v, lln, uln, lnSrc: src('lln'), unSrc: src('uln'),

      note: [r.note, noteExtra].filter(Boolean).join('. '),
      assumed: e.assumed, derived: !!e.derived, ca_unc: spec.key === 'ca' && !E.alb,

}

function fmtVal(it, mode) {
  if (it.count) return mode === 'e9' ? fmtNum(it.v / 1000, 2) + ' ×10⁹/L' : groupDots(it.v) + '/µL';
  const s = fmtNum(it.v, smartDec(it.v));
  return it.unit ? s + ' ' + it.unit : s;
}
function fmtRef(it, x, mode) {
  if (x == null) return '';

  return fmtNum(x, smartDec(x));
}

const fmtDate = d => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ''); if (!m) return ''; return LANG === 'en' ? parseInt(m[3], 10) + ' ' + MONTHS[parseInt(m[2], 10) - 1] + ' ' + m[1] : m[3] + '/' + m[2] + '/' + m[1]; };

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function buildReport(items, parsed, o) {
  const abn = items.filter(i => i.g > 0);
  const gw = S('grado ', 'grade ');
  const gtxt = i => (i.open ? (o.gs === 'G' ? '≥G1' : gw + '≥1') : (o.gs === 'G' ? 'G' + i.g : gw + i.g)) + (i.clin || i.open ? '*' : '');
  const one = i => i.term + ' ' + gtxt(i) + (o.vals ? ' (' + i.short + ' ' + fmtVal(i, o.units) + ')' : '');
  const dpre = o.date ? S('Analítica del ', 'Labs from ') + fmtDate(o.date) + '. ' : '';
  const head = dpre + S('Alteraciones según CTCAE v5.0:', 'Abnormalities by CTCAE v5.0:');
  let out = '';
  if (!items.length) return '';
  if (!abn.length) out = dpre + S('Sin alteraciones de grado CTCAE en los parámetros evaluados.', 'No CTCAE-graded abnormalities in the evaluated parameters.');
  else if (o.fmt === 'para') out = head + ' ' + abn.map(i => lcFirst(one(i))).join(', ') + '.';
  else out = head + '\n' + abn.map(i => '• ' + one(i)).join('\n');
  if (o.norm) {
    const ok = items.filter(i => i.g === 0).map(i => i.short);
    if (ok.length && abn.length) out += '\n' + S('Sin alteración de grado CTCAE: ', 'No CTCAE-graded abnormality: ') + ok.join(', ') + '.';
  }
  if (o.notes) {
    const n = [];
    if (abn.some(i => i.clin)) n.push(S('* Grado según el valor analítico; puede ser superior según la clínica o el tratamiento (transfusión, reposición intravenosa, síntomas).',
      '* Grade based on the lab value; may be higher depending on clinical status or treatment (transfusion, intravenous replacement, symptoms).'));
    if (abn.some(i => i.open)) n.push(S('≥G1: en CTCAE v5.0 la hiperglucemia se gradúa por el manejo clínico.', '≥G1: in CTCAE v5.0 hyperglycemia is graded by clinical management.'));
    if (items.some(i => i.ca_unc)) n.push(S('Calcio sin corregir por albúmina.', 'Calcium not corrected for albumin.'));
    const ass = items.filter(i => i.assumed).map(i => i.short);
    if (ass.length) n.push(S('Unidades asumidas por magnitud del valor: ', 'Units assumed from the magnitude of the value: ') + ass.join(', ') + '.');
    const ng = items.filter(i => i.g === null).map(i => i.short);
    if (ng.length) n.push(S('No gradable por falta de dato: ', 'Not gradable due to missing data: ') + ng.join(', ') + '.');
    if (abn.some(i => /LSN|ULN/.test(i.note || ''))) n.push(S('Gradación por múltiplos del LSN, asumiendo valor basal normal.', 'Graded by multiples of the ULN, assuming a normal baseline.'));
    if (n.length) out += '\n' + n.join('\n');
  }
  return out;
}

  document.documentElement.lang = LANG;
  document.title = T.docTitle;
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = T[e.dataset.i18n]; });
  document.querySelectorAll('[data-i18n-ph]').forEach(e => { e.placeholder = T[e.dataset.i18nPh]; });
  $('input').setAttribute('aria-label', LANG === 'en' ? 'Lab text' : 'Texto de la analítica');
  $('report').setAttribute('aria-label', LANG === 'en' ? 'Generated report' : 'Informe generado');
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opts = () => ({ date: $('date').value, fmt: $('fmt').value, gs: $('gs').value, units: $('units').value,
  vals: $('oVals').checked, norm: $('oNorm').checked, notes: $('oNotes').checked });

function chip(i) {
  if (i.g === null) return '<span class="chip cn">' + S('n/d', 'n/a') + '</span>';
  const t = i.open ? '≥1' : (i.g === 0 ? '0' : String(i.g));
  return '<span class="chip c' + i.g + '">' + t + (i.clin || i.open ? '*' : '') + '</span>';
}
function refCell(i, b, mode) {
  const used = i.use === 'both' || i.use === b;
  if (!used) return '<span class="dash">—</span>';
  const val = b === 'lln' ? i.lln : i.uln, src = b === 'lln' ? i.lnSrc : i.unSrc;
  const srcTxt = src === 'editado' ? S('editado', 'edited') : src === 'línea' ? S('línea', 'line') : S('defecto', 'default');
  const bound = b === 'lln' ? S(' límite inferior', ' lower limit') : S(' límite superior', ' upper limit');
  return '<input class="num' + (src === 'editado' ? ' edited' : '') + '" inputmode="decimal" data-k="' + i.key + '" data-b="' + b +
    '" value="' + esc(fmtRef(i, val, mode)) + '" aria-label="' + esc(i.name) + bound + '" title="' + S('Origen: ', 'Source: ') + srcTxt + '">';
}
function renderTable(items, parsed) {
  const mode = $('units').value;
  $('tbody').innerHTML = items.map(i => '<tr><td>' + esc(i.name) + (i.derived ? ' <span class="small">' + S('(calculado)', '(calculated)') + '</span>' : '') + '</td>' +
    '<td class="r">' + esc(i.count ? (mode === 'e9' ? fmtNum(i.v / 1000, 2) : groupDots(i.v)) : fmtNum(i.v, smartDec(i.v))) + '</td>' +
    '<td>' + esc(i.count ? (mode === 'e9' ? '×10⁹/L' : '/µL') : i.unit) + (i.assumed ? ' <span class="small" title="' + S('Unidad asumida por la magnitud del valor', 'Unit assumed from the magnitude of the value') + '">' + S('(asumida)', '(assumed)') + '</span>' : '') + '</td>' +
    '<td class="r">' + refCell(i, 'lln', mode) + '</td><td class="r">' + refCell(i, 'uln', mode) + '</td>' +
    '<td>' + (i.g > 0 ? esc(i.term) : '<span class="dash">' + (i.g === 0 ? S('Sin alteración', 'Within limits') : esc(i.term)) + '</span>') + '</td>' +
    '<td>' + chip(i) + '</td><td class="small">' + esc(i.note || '') + '</td></tr>').join('') ||
    '<tr><td colspan="8" class="small">' + S('Pega una analítica para ver los parámetros detectados.', 'Paste lab results to see the detected parameters.') + '</td></tr>';
  const abn = items.filter(i => i.g > 0);
  $('summary').innerHTML = items.length ? '<span class="small">' + items.length + S(' parámetros, ', ' parameters, ') + abn.length + S(' alterados', ' abnormal') + '</span>' +
    [1,2,3,4].map(g => { const c = abn.filter(i => i.g === g && !i.open).length; return c ? '<span class="chip c' + g + '">G' + g + ' × ' + c + '</span>' : ''; }).join('') : '';
  const u = parsed.unrec;
  $('unrecBox').hidden = !u.length;
  if (u.length) {
    $('unrecSum').textContent = LANG === 'en'
      ? u.length + (u.length === 1 ? ' line without a CTCAE laboratory criterion or not recognized' : ' lines without a CTCAE laboratory criterion or not recognized')
      : u.length + (u.length === 1 ? ' línea sin criterio CTCAE de laboratorio o no reconocida' : ' líneas sin criterio CTCAE de laboratorio o no reconocidas');
    $('unrec').textContent = u.join('\n');
  }
}
function update() {
  const parsed = parseText($('input').value);
  const items = evaluate(parsed, { sex: $('sex').value, ov: state.ov });
  renderTable(items, parsed);
  $('report').value = buildReport(items, parsed, opts());
}
async function copyReport() {
  const t = $('report').value, el = $('copied');
  let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch (e) {
    try { $('report').select(); ok = document.execCommand('copy'); } catch (e2) { ok = false; }
  }
  el.textContent = ok ? S('Informe copiado', 'Report copied') : S('No se pudo copiar: selecciona el texto y copia con Ctrl+C', 'Could not copy: select the text and press Ctrl+C');
  setTimeout(() => { el.textContent = ''; }, 3000);
}
$('input').addEventListener('input', () => { state.ov = {}; update(); });
['sex','date','fmt','gs','units','oVals','oNorm','oNotes'].forEach(id => $(id).addEventListener('change', update));
$('lang').addEventListener('change', () => {
  const cur = $('input').value, wasSample = cur === SAMPLE_ES || cur === SAMPLE_EN;
  LANG = $('lang').value;
  if (wasSample) $('input').value = sample();
  applyLang(); update();
});
$('tbody').addEventListener('change', ev => {
  const t = ev.target; if (!t.matches('input.num')) return;
  const k = t.dataset.k, b = t.dataset.b, txt = t.value.trim();
  const spec = BYKEY[k];
  state.ov[k] = state.ov[k] || {};
  if (txt === '') delete state.ov[k][b];
  else {
    let x = parseNum(txt.replace(/\s/g, ''), !!spec.count);
    if (isFinite(x)) { if (spec.count && $('units').value === 'e9' && x < 1000) x *= 1000; state.ov[k][b] = x; }
  }
  update();
});
$('btnSample').addEventListener('click', () => { $('input').value = sample(); state.ov = {}; update(); });
$('btnClear').addEventListener('click', () => { $('input').value = ''; state.ov = {}; update(); $('input').focus(); });
$('btnCopy').addEventListener('click', copyReport);
LANG = /^en/i.test(navigator.language || '') ? 'en' : 'es';
$('lang').value = LANG;
$('input').value = sample();
applyLang();
update();
</script>
</body>
</html>
